name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server unit & integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

  dashboard-build:
    name: Dashboard typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://obd-api.hon2838.name.my

  android-tests:
    name: Android head-unit and Android Auto builds & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build both supported variants
        run: ./gradlew :app:testStandardDebugUnitTest :app:testAndroidautoDebugUnitTest :app:assembleStandardDebug :app:assembleAndroidautoDebug :app:assembleAndroidautoRelease :app:lintAndroidautoDebug --no-daemon
      - name: Check phone manifest and reject new lint errors
        run: python3 scripts/check_androidauto_validation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            AndroidApp/app/build/reports/tests/
            AndroidApp/app/build/reports/lint-results-androidautoDebug.*
            AndroidApp/app/build/outputs/apk/androidauto/

  apk-bundle-verify:
    name: Verify APK release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify staged APK matches version.json metadata
        run: |
          set -e
          if [ ! -f Server/agent/app-debug.apk ] || [ ! -f Server/agent/version.json ]; then
            echo "Notice: Staged APK or version.json not present in repository checkout (built dynamically via Makefile). Skipping static verification."
            exit 0
          fi

          EXPECTED_SHA=$(node -e 'console.log(require("./Server/agent/version.json").sha256)')
          ACTUAL_SHA=$(sha256sum Server/agent/app-debug.apk | awk '{print $1}')

          echo "Expected SHA256: $EXPECTED_SHA"
          echo "Actual SHA256:   $ACTUAL_SHA"

          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::Server/agent/app-debug.apk SHA256 does not match version.json."
            exit 1
          fi
          echo "OK: APK bundle integrity verified."
