version: '3.8'

services:
  server:
    build: ./Server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - server-data:/app/data
    restart: always

  dashboard:
    build:
      context: ./Dashboard
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3003:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - server
    restart: always

volumes:
  server-data:
