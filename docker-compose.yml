version: '3.8'

services:
  server:
    build:
      context: ./Server
      # Build identity. The Makefile / CI passes these in
      # via `--build-arg`, otherwise the Dockerfile defaults
      # (dev / unknown) are used. The resulting image
      # reports them in /healthz and `docker inspect`.
      args:
        - SERVICE_VERSION=${SERVICE_VERSION:-1.2.0}
        - BUILD_COMMIT=${BUILD_COMMIT:-unknown}
        - BUILD_TIME=${BUILD_TIME:-unknown}
    image: obd-telemetry-server:${BUILD_COMMIT:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Required. The server boot-guard (Server/server.js)
      # refuses to start if OBD_API_KEY is missing or
      # < 32 chars. Set in .env at the repo root.
      - OBD_API_KEY=${OBD_API_KEY}
      - OBD_STORAGE_ENGINE=${OBD_STORAGE_ENGINE:-json}
      - OBD_INITIAL_ADMIN_PASSWORD=${OBD_INITIAL_ADMIN_PASSWORD:-}
      - OBD_TRUST_PROXY=${OBD_TRUST_PROXY:-false}
      - DASHBOARD_PUBLIC_URL=${DASHBOARD_PUBLIC_URL:-https://obd.hon2838.name.my}
      - API_PUBLIC_URL=${NEXT_PUBLIC_API_URL:-https://obd-api.hon2838.name.my}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - NODE_OPTIONS=${NODE_OPTIONS:-}
      - NODE_ENV=production
    volumes:
      - server-data:/app/data
    restart: always
    healthcheck:
      # Mirror the Dockerfile HEALTHCHECK. Compose's block
      # wins for `docker ps`; the Dockerfile block wins for
      # `docker inspect`. Both should match. Use 127.0.0.1
      # (not localhost) to skip the IPv6/IPv4 DNS resolver
      # issue on Alpine.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./Dashboard
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://obd-api.hon2838.name.my}
        - SERVICE_VERSION=${SERVICE_VERSION:-1.2.0}
        - BUILD_COMMIT=${BUILD_COMMIT:-unknown}
        - BUILD_TIME=${BUILD_TIME:-unknown}
    image: obd-telemetry-dashboard:${BUILD_COMMIT:-latest}
    ports:
      - "127.0.0.1:3003:3001"
    environment:
      # Server-side dashboard requests use the private Compose network.
      # NEXT_PUBLIC_API_URL remains the browser-facing public URL.
      - INTERNAL_API_URL=http://server:3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://obd-api.hon2838.name.my}
      - DASHBOARD_PUBLIC_URL=${DASHBOARD_PUBLIC_URL:-https://obd.hon2838.name.my}
      - NODE_ENV=production
    depends_on:
      - server
    restart: always
    healthcheck:
      # /healthz returns 200 with {"status":"ok",...} when the
      # Next.js process is alive. The page is excluded from
      # auth in proxy.ts, so we don't need to send
      # credentials to probe it. Use 127.0.0.1 (not localhost)
      # to skip the IPv6/IPv4 DNS resolver issue on Alpine.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  server-data:
